<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'"><title>VoiceFlow History</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="history.css"></head><body><div class="chrome"><img class="app-logo" src="../assets/icon.png" alt="">VoiceFlow</div><header><h1>History</h1><input id="search" type="search" placeholder="Search dictations" aria-label="Search history"><select id="filter" aria-label="Filter format"><option value="">All formats</option><option value="plain">Plain text</option><option value="list">Lists</option></select><button id="export" class="ghost">Export</button><button id="clear" class="ghost danger">Clear all</button><small id="count"></small></header><main><nav id="entries" aria-label="Dictations"></nav><section id="detail"><div id="empty"><h2>No dictations yet</h2><p>Your recent dictations will appear here.</p></div><div id="editor" hidden><p id="meta"></p><label for="final">Your dictation</label><textarea id="final" spellcheck="false"></textarea><div class="actions"><button id="copy" class="primary">Copy text</button><button id="save">Save edit</button><details class="more"><summary>More actions</summary><div class="more-actions"><label for="layout">Layout</label><select id="layout"><option value="auto">Automatic</option><option value="plain">Plain text</option><option value="list">Bullet list</option></select><button id="reformat">Reformat original</button><button id="delete" class="danger ghost">Delete dictation</button></div></details></div><details class="original"><summary>Original transcript</summary><pre id="original"></pre><button id="copy-original">Copy original</button></details><p class="hint">Edits stay here until you copy them.</p></div></section></main><footer id="status" role="status"></footer><script>
let entries=[],selected=null,busy=false;const $=id=>document.getElementById(id),say=text=>$('status').textContent=text;
function current(){return entries.find(e=>String(e.id)===selected)}
function render(){const q=$('search').value.toLocaleLowerCase(),format=$('filter').value;const visible=entries.filter(e=>(!format||(e.format||'plain')===format)&&((e.raw||'')+' '+(e.cleaned||'')).toLocaleLowerCase().includes(q));$('count').textContent=visible.length+' / '+entries.length;$('entries').replaceChildren();for(const e of visible){const b=document.createElement('button');b.className='entry'+(String(e.id)===selected?' selected':'');const meta=document.createElement('small');meta.textContent=new Date(e.ts).toLocaleString()+' · '+(e.format||e.mode||'plain');const text=document.createElement('span');text.className='preview';text.textContent=e.cleaned||e.raw;b.append(text,meta);b.setAttribute("aria-pressed",String(String(e.id)===selected));b.onclick=()=>{selected=String(e.id);render();show()};$('entries').append(b)}if(!visible.length){const p=document.createElement('p');p.className='list-empty';p.textContent=entries.length?'No matching dictations.':'No dictations yet.';$('entries').append(p)}}
function show(){const e=current();$('editor').hidden=!e;$('empty').hidden=!!e;if(!e)return;$('meta').textContent=new Date(e.ts).toLocaleString()+' · '+(e.format||e.mode||'plain')+(e.edited?' · edited':'')+(e.warning?' · '+e.warning:'');$('final').value=e.cleaned||e.raw;$('original').textContent=e.raw;}
function receive(data){entries=data;if(!current())selected=entries.length?String(entries[0].id):null;render();show()}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){say(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('search').oninput=render;$('filter').onchange=render;
$('copy').onclick=()=>action(async()=>{await window.vf.copyText($('final').value);say('Final text copied.')});$('copy-original').onclick=()=>action(async()=>{await window.vf.copyText(current().raw);say('Original copied.')});
$('save').onclick=()=>action(async()=>{await window.vf.updateHistoryItem({id:selected,cleaned:$('final').value});say('Edit saved. Original retained.')});
$('delete').onclick=()=>action(async()=>{if(confirm('Delete this dictation?')){await window.vf.deleteHistoryItem(selected);say('Entry deleted.')}});
$('clear').onclick=()=>action(async()=>{if(confirm('Delete all saved dictations?')){await window.vf.clearHistory();say('History cleared.')}});
$('export').onclick=()=>action(async()=>{const result=await window.vf.exportHistory();say(result.cancelled?'Export cancelled.':'History exported.')});
$('reformat').onclick=()=>action(async()=>{say('Formatting original locally…');const result=await window.vf.reformatHistoryItem({id:selected,format:$('layout').value});say(result.warning||'Reformatted. Review the final text before copying.');});
window.vf.on('history-update',receive);window.vf.getHistory().then(receive).catch(e=>say(e.message));
</script></body></html>
